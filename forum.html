<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Forum · CampusMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="forum">
  <div id="app-header"></div>

  <main id="main">
    <section class="page-banner">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / Community Forum</div>
        <h1>Community Forum</h1>
        <p>Ask questions, share what works for you and support each other. Counselors join conversations too, and moderators keep it safe.</p>
      </div>
    </section>

    <section class="section tight">
      <div class="wrap layout-side">
        <aside class="card sticky">
          <h3>Categories</h3>
          <div class="cat-list" id="cats"></div>
          <div class="alert" style="margin:18px 0 0">
            <span data-icon="shield"></span>
            <span class="small"><b>Community guidelines</b>Be kind. Protect privacy. No medical advice. Report anything that worries you.</span>
          </div>
        </aside>

        <div class="card">
          <div class="filters" style="margin-bottom:6px">
            <div class="input-icon" style="flex:1;min-width:200px"><span data-icon="search"></span><input class="input" id="q" type="search" placeholder="Search discussions…" aria-label="Search discussions" style="width:100%"></div>
            <button class="btn btn-primary" id="new-post"><span data-icon="plus"></span> New discussion</button>
          </div>
          <div id="posts"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (async function () {
      const { api, esc, icon } = CM;
      const user = await CM.page({ page: 'forum' });
      let cat = CM.qs('cat') || '';

      function renderCats() {
        const all = api.visiblePosts();
        document.getElementById('cats').innerHTML =
          '<a href="?" data-cat="" class="' + (!cat ? 'active' : '') + '"><span>All discussions</span><span class="badge">' + all.length + '</span></a>' +
          api.categories().map(c => '<a href="?cat=' + c.id + '" data-cat="' + c.id + '" class="' + (cat === c.id ? 'active' : '') + '"><span><span class="cat-dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</span><span class="badge">' + all.filter(p => p.categoryId === c.id).length + '</span></a>').join('');
      }

      function renderPosts() {
        const q = document.getElementById('q').value.trim().toLowerCase();
        const posts = api.visiblePosts(cat).filter(p => !q || (p.title + ' ' + p.body).toLowerCase().includes(q));
        const box = document.getElementById('posts');
        if (!posts.length) { box.innerHTML = CM.emptyState('forum', 'No discussions here yet. Start the first one!'); return; }
        box.innerHTML = posts.map(p => {
          const c = CM.db.find('forumCategories', p.categoryId) || {};
          const replies = api.commentsFor(p.id).length;
          const rc = api.reactionCounts('post', p.id);
          const author = p.anonymous ? null : api.user(p.authorId);
          return '<div class="post-row">' + CM.avatar(author) + '<div class="main">' +
            '<h4>' + (p.pinned ? '<span title="Pinned" style="color:var(--gold)">' + icon('pin').replace('<svg ', '<svg style="width:15px;height:15px;vertical-align:-2px" ') + '</span> ' : '') + '<a href="thread.html?id=' + p.id + '">' + esc(p.title) + '</a>' + (p.locked ? ' <span class="badge grey">' + 'locked</span>' : '') + '</h4>' +
            '<p>' + esc(p.body) + '</p>' +
            '<div class="meta-line"><span><span class="cat-dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</span><span>by ' + esc(api.displayName(p.authorId, p.anonymous)) + '</span><span>' + CM.timeAgo(p.createdAt) + '</span></div></div>' +
            '<div class="stats"><b>' + replies + '</b>replies</div><div class="stats"><b>' + (rc.support + rc.relate + rc.thanks) + '</b>reactions</div></div>';
        }).join('');
      }

      document.getElementById('cats').addEventListener('click', e => {
        const a = e.target.closest('[data-cat]'); if (!a) return;
        e.preventDefault(); cat = a.dataset.cat;
        history.replaceState(null, '', cat ? '?cat=' + cat : 'forum.html');
        renderCats(); renderPosts();
      });
      document.getElementById('q').addEventListener('input', renderPosts);

      document.getElementById('new-post').addEventListener('click', () => {
        if (!user) { location.href = 'login.html?next=forum.html'; return; }
        const cats = api.categories().filter(c => c.id !== 'cat_5' || user.role === 'admin');
        CM.modal({
          title: 'Start a discussion',
          wide: true,
          body: '<form novalidate>' +
            '<div class="field" data-field="categoryId"><label for="p-c">Category</label><select class="input" id="p-c" name="categoryId"><option value="">Choose…</option>' + cats.map(c => '<option value="' + c.id + '" ' + (c.id === cat ? 'selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select><div class="err"></div></div>' +
            '<div class="field" data-field="title"><label for="p-t">Title</label><input class="input" id="p-t" name="title" maxlength="150"><div class="err"></div></div>' +
            '<div class="field" data-field="body"><label for="p-b">Message</label><textarea class="input" id="p-b" name="body" rows="6" maxlength="4000"></textarea><div class="err"></div></div>' +
            (user.role === 'student' ? '<label class="check" style="margin-bottom:12px"><input type="checkbox" name="anonymous"> Post anonymously</label>' : '') +
            '<div class="form-actions"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary">Post discussion</button></div></form>',
          onMount(m, close) {
            const form = m.querySelector('form');
            CM.onSubmit(form, async () => {
              try { const p = await api.createPost(user, CM.formData(form)); close(); location.href = 'thread.html?id=' + p.id; }
              catch (err) { CM.showErrors(form, err); }
            });
          }
        });
      });

      renderCats(); renderPosts();
    })();
  </script>
</body>
</html>
